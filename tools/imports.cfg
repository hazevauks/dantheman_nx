# The game's one module: Halfbrick's Mortar engine with the game linked in.
# (libjs.so, libadcolony.so and libcrashlytics.so are the ad and crash SDKs'
# and are not loaded.)
MODULES libmortargame.so

# libm and libc functions whose bionic and newlib ABIs agree (softfp, no
# struct, no FILE, no errno above 34) and that the runtime's own list lacks.
PASSTHROUGH ceil ceilf floor floorf sqrt sqrtf atoll

# Google's blocking-region hooks (tcmalloc / protobuf): weak, tested for NULL.
WEAK_NULL __google_potentially_blocking_region_begin protobuf's hook; weak, tested for NULL
WEAK_NULL __google_potentially_blocking_region_end protobuf's hook; weak, tested for NULL
